name: Build sub2api arm64 APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub2api-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'FM-Apricity/cherry-studio-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: 'true'
      PROFILE: preview
      CHERRY_SUB2API_BUILD: 'true'
      SUB2API_ANDROID_VERSION_CODE: ${{ github.run_number }}
      APK_UPDATES_ENABLED: 'false'
      DOMESTIC_STORES_ENABLED: 'false'
      NODE_OPTIONS: --max-old-space-size=6144
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Free space for native dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
          df -h .
      - uses: pnpm/action-setup@v4
        with:
          version: 12.2.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate fork configuration and relay contract
        run: |
          pnpm test:app --runTestsByPath scripts/__tests__/sub2apiAppConfig.test.ts src/backend/ai/agent/runtime/pi/__tests__/piChatResponses.test.ts src/backend/ai/agent/runtime/pi/__tests__/piApiAdapters.test.ts src/backend/ai/agent/runtime/pi/__tests__/PiDurableAgentRuntime.test.ts --runInBand
      - name: Generate Android project without Expo credentials
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Build standalone arm64 release
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a \
            '-Porg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g' \
            -PreactNativeBundleCommand=export:embed
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SUB2API_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SUB2API_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SUB2API_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          umask 077
          keystore="$RUNNER_TEMP/sub2api-release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p dist
          apk="dist/cherry-studio-sub2api-arm64-${GITHUB_RUN_NUMBER}.apk"
          "$tools/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee dist/signature.txt
          "$tools/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.cherryai.cherrystudio_app.sub2api'" "$RUNNER_TEMP/badging.txt"
          grep -q "native-code: 'arm64-v8a'$" "$RUNNER_TEMP/badging.txt"
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          python3 - "$RUNNER_TEMP/manifest.txt" <<'PY'
          import pathlib, re, sys
          manifest = pathlib.Path(sys.argv[1]).read_text()
          for name in ('expo.modules.updates.ENABLED', 'expo.modules.appupdate.APK_UPDATES_ENABLED'):
              assert re.search(re.escape(name) + r'[^\n]*\n\s*A: android:value[^\n]*0x0\b', manifest), name
          PY
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          printf 'Source commit: %s\nBuild: %s\nPackage: com.cherryai.cherrystudio_app.sub2api\nABI: arm64-v8a\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > dist/build-info.txt
          cat dist/build-info.txt dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: cherry-studio-sub2api-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
